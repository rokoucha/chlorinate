name: Deploy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: chlorine

    steps:
      - name: Install cloudflared
        env:
          # renovate: datasource=github-releases depName=cloudflare/cloudflared
          CLOUDFLARED_VERSION: "2026.5.2"
        run: |
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Deploy via SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          cloudflared access tcp \
            --hostname ${{ vars.ROUTER_CF_HOSTNAME }} \
            --url localhost:2222 &
          CF_PID=$!
          until bash -c '</dev/tcp/localhost/2222' 2>/dev/null; do sleep 0.1; done

          ssh \
            -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -p 2222 \
            deploy@localhost

          kill ${CF_PID} 2>/dev/null || true
