name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  nix:
    name: Nix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Check flake
        run: nix flake check --all-systems --no-build

      - name: Build mape
        run: nix build .#packages.x86_64-linux.mape

      - name: Build chlorinate system
        run: nix build .#nixosConfigurations.chlorinate.config.system.build.toplevel
